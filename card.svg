<svg xmlns="http://www.w3.org/2000/svg" width="400" height="665" viewBox="0 0 400 665" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;fill:#9ca3af}
    .key{font-size:11px;font-weight:600;fill:#6b7280}
    .val{font-size:13px;font-weight:600;fill:#111827}
    .chip{fill:#eff6ff;stroke:#bfdbfe}
    .ct{font-size:12px;font-weight:600;fill:#1e3a8a;text-anchor:middle}
  </style>
  <defs><clipPath id="c"><rect width="400" height="665" rx="22"/></clipPath></defs>

  <g clip-path="url(#c)">
    <rect width="400" height="665" fill="#fff"/>
    <rect width="400" height="110" fill="#1e3a8a"/>
    <circle cx="350" cy="20" r="60" fill="#2d4fb3" opacity=".6"/>
    <circle cx="40" cy="95" r="40" fill="#2d4fb3" opacity=".4"/>
  </g>
  <rect x="1" y="1" width="398" height="663" rx="22" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- avatar (swap later) -->
  <circle cx="200" cy="100" r="46" fill="#fff"/>
  <circle cx="200" cy="100" r="42" fill="#3b82f6"/>
  <text x="200" y="114" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">N</text>

  <text x="200" y="184" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Nadet</text>
  <text x="200" y="206" text-anchor="middle" font-size="13" fill="#6b7280">Solo Dev &amp; IT Student</text>
  <text x="200" y="234" text-anchor="middle" font-size="12.5" fill="#4b5563">I build apps for iOS &amp; Android, web stuff,</text>
  <text x="200" y="252" text-anchor="middle" font-size="12.5" fill="#4b5563">and tiny chips that blink.</text>

  <line x1="40" y1="272" x2="360" y2="272" stroke="#e5e7eb"/>

  <!-- info -->
  <circle cx="46" cy="297" r="4" fill="#3b82f6"/>
  <text x="58" y="301" class="key">Location</text>
  <text x="360" y="301" text-anchor="end" class="val">Phnom Penh, Cambodia</text>

  <circle cx="46" cy="325" r="4" fill="#3b82f6"/>
  <text x="58" y="329" class="key">Studying</text>
  <text x="360" y="329" text-anchor="end" class="val">IT @ RULE</text>

  <circle cx="46" cy="353" r="4" fill="#3b82f6"/>
  <text x="58" y="357" class="key">Works on</text>
  <text x="360" y="357" text-anchor="end" class="val">iOS • Android • Web • Embedded</text>

  <circle cx="46" cy="381" r="4" fill="#3b82f6"/>
  <text x="58" y="385" class="key">GitHub</text>
  <text x="360" y="385" text-anchor="end" class="val">@thenullastris</text>

  <line x1="40" y1="406" x2="360" y2="406" stroke="#e5e7eb"/>

  <!-- building -->
  <text x="40" y="430" class="lbl">CURRENTLY BUILDING</text>
  <rect x="40" y="442" width="320" height="62" rx="12" fill="#f0f6ff" stroke="#bfdbfe"/>
  <rect x="54" y="456" width="34" height="34" rx="9" fill="#1e3a8a"/>
  <text x="71" y="479" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Z</text>
  <text x="100" y="470" font-size="14" font-weight="700" fill="#111827">Zenith Launcher</text>
  <text x="100" y="487" font-size="11.5" fill="#6b7280">Open-source iOS Minecraft Java launcher</text>

  <line x1="40" y1="524" x2="360" y2="524" stroke="#e5e7eb"/>

  <!-- stack -->
  <text x="40" y="548" class="lbl">TECH STACK</text>
  <rect class="chip" x="40"  y="560" width="56" height="26" rx="13"/><text class="ct" x="68"  y="577">Swift</text>
  <rect class="chip" x="102" y="560" width="64" height="26" rx="13"/><text class="ct" x="134" y="577">Obj-C</text>
  <rect class="chip" x="172" y="560" width="64" height="26" rx="13"/><text class="ct" x="204" y="577">Kotlin</text>
  <rect class="chip" x="242" y="560" width="48" height="26" rx="13"/><text class="ct" x="266" y="577">PHP</text>
  <rect class="chip" x="296" y="560" width="64" height="26" rx="13"/><text class="ct" x="328" y="577">Python</text>

  <rect class="chip" x="40"  y="594" width="70" height="26" rx="13"/><text class="ct" x="75"  y="611">Arduino</text>
  <rect class="chip" x="116" y="594" width="60" height="26" rx="13"/><text class="ct" x="146" y="611">ESP32</text>
  <rect class="chip" x="182" y="594" width="58" height="26" rx="13"/><text class="ct" x="211" y="611">Figma</text>
  <rect class="chip" x="246" y="594" width="114" height="26" rx="13"/><text class="ct" x="303" y="611">GitHub Actions</text>

  <text x="200" y="648" text-anchor="middle" font-size="11.5" font-style="italic" fill="#9ca3af">ship it, fix it later</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
